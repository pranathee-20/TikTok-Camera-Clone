<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive frontend clone of the TikTok camera screen using Browser Media APIs.">
  <title>TikTok Camera Clone</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main mobile camera experience. -->
  <main id="camera-container" aria-label="TikTok camera">
    <!-- Empty recording progress indicator. -->
    <progress id="progress-bar" value="0" max="100" aria-label="Recording progress">0%</progress>

    <!-- Live browser camera preview. -->
    <section id="live-camera-section" aria-label="Live camera preview">
      <video id="camera-video" autoplay muted playsinline aria-label="Live camera preview">
        Your browser does not support video playback.
      </video>
    </section>

    <!-- Camera controls shown across the top of the preview. -->
    <header id="top-control-bar" aria-label="Camera controls">
      <nav id="top-controls" aria-label="Top camera controls">
        <button id="close-button" type="button" aria-label="Close camera" title="Close camera"><span aria-hidden="true">✕</span><span>Close</span></button>
        <button id="flash-button" type="button" aria-label="Toggle flash" title="Toggle flash"><span aria-hidden="true">⚡</span><span>Flash</span></button>
        <button id="speed-button" type="button" aria-label="Adjust recording speed" title="Adjust recording speed"><span aria-hidden="true">⏩</span><span>Speed</span></button>
        <button id="beauty-button" type="button" aria-label="Open beauty controls" title="Open beauty controls"><span aria-hidden="true">✨</span><span>Beauty</span></button>
        <button id="filters-button" type="button" aria-label="Open filters" title="Open filters"><span aria-hidden="true">🎨</span><span>Filters</span></button>
        <button id="timer-button" type="button" aria-label="Set recording timer" title="Set recording timer"><span aria-hidden="true">⏱️</span><span>Timer</span></button>
        <button id="green-screen-button" type="button" aria-label="Open green screen" title="Open green screen"><span aria-hidden="true">🟩</span><span>Green Screen</span></button>
        <button id="upload-button" type="button" aria-label="Upload media" title="Upload media"><span aria-hidden="true">⬆️</span><span>Upload</span></button>
        <button id="settings-button" type="button" aria-label="Open camera settings" title="Open camera settings"><span aria-hidden="true">⚙️</span><span>Settings</span></button>
      </nav>
    </header>

    <!-- Contextual tools shown down the right edge of the preview. -->
    <aside id="right-toolbar" aria-label="Camera tools">
      <button id="toolbar-flip-camera-button" type="button" aria-label="Flip camera" title="Flip camera"><span aria-hidden="true">🔄</span><span>Flip Camera</span></button>
      <button id="effects-button" type="button" aria-label="Open effects" title="Open effects"><span aria-hidden="true">🌟</span><span>Effects</span></button>
      <button id="templates-button" type="button" aria-label="Open templates" title="Open templates"><span aria-hidden="true">▣</span><span>Templates</span></button>
      <button id="voice-effects-button" type="button" aria-label="Open voice effects" title="Open voice effects"><span aria-hidden="true">🎙️</span><span>Voice Effects</span></button>
      <button id="retouch-button" type="button" aria-label="Open retouch controls" title="Open retouch controls"><span aria-hidden="true">💄</span><span>Retouch</span></button>
      <button id="ai-enhance-button" type="button" aria-label="Use AI Enhance" title="Use AI Enhance"><span aria-hidden="true">🤖</span><span>AI Enhance</span></button>
    </aside>

    <!-- Recording state indicators. -->
    <section id="recording-indicators" aria-label="Recording status">
      <time id="recording-timer" datetime="PT0M0S" hidden>00:00</time>
      <p id="recording-badge" hidden aria-label="Recording in progress">REC</p>
    </section>

    <!-- Primary capture controls and selectable recording modes. -->
    <section id="recording-section" aria-label="Recording controls">
      <nav id="recording-modes" aria-label="Recording modes">
        <button id="photo-mode-button" type="button" aria-label="Select Photo mode" title="Select Photo mode">Photo</button>
        <button id="video-mode-button" type="button" aria-label="Select Video mode" title="Select Video mode" aria-pressed="true">Video</button>
        <button id="sixty-seconds-mode-button" type="button" aria-label="Select 60 seconds mode" title="Select 60 seconds mode">60s</button>
        <button id="fifteen-seconds-mode-button" type="button" aria-label="Select 15 seconds mode" title="Select 15 seconds mode">15s</button>
        <button id="story-mode-button" type="button" aria-label="Select Story mode" title="Select Story mode">Story</button>
        <button id="live-mode-button" type="button" aria-label="Select LIVE mode" title="Select LIVE mode">LIVE</button>
      </nav>

      <nav id="capture-controls" aria-label="Capture controls">
        <button id="gallery-button" type="button" aria-label="Open gallery" title="Open gallery"><span aria-hidden="true">🖼️</span><span>Gallery</span></button>
        <button id="record-button" type="button" aria-label="Start recording" title="Start recording">
          <span id="record-outer-circle" aria-hidden="true"><span id="record-inner-circle"></span></span>
          <span class="visually-hidden">Record</span>
        </button>
        <button id="flip-camera-button" type="button" aria-label="Flip camera" title="Flip camera"><span aria-hidden="true">🔄</span><span>Flip</span></button>
      </nav>
    </section>

    <!-- Shown after a recording is complete. -->
    <section id="recording-preview" hidden aria-label="Recorded video preview">
      <h2>Recorded Video</h2>
      <video id="recorded-video" controls aria-label="Recorded video preview">
        Your browser does not support video playback.
      </video>
      <nav id="preview-actions" aria-label="Recorded video actions">
        <button id="retake-button" type="button" aria-label="Retake recording" title="Retake recording">Retake</button>
        <button id="download-button" type="button" aria-label="Download recording" title="Download recording">Download</button>
        <button id="save-draft-button" type="button" aria-label="Save recording as draft" title="Save recording as draft">Save Draft</button>
        <button id="next-button" type="button" aria-label="Continue to next step" title="Continue to next step">Next</button>
      </nav>
    </section>

    <!-- Visible until browser camera permission is granted. -->
    <section id="permission-overlay" role="dialog" aria-modal="true" aria-labelledby="permission-heading" aria-describedby="permission-description">
      <p id="camera-icon" aria-hidden="true">📷</p>
      <h1 id="permission-heading">Allow Camera Access</h1>
      <p id="permission-description">This application requires permission to use your camera.</p>
      <button id="enable-camera-button" type="button" aria-label="Enable camera" title="Enable camera">Enable Camera</button>
    </section>

    <!-- Shown while the browser opens the camera. -->
    <section id="loading-overlay" hidden role="status" aria-live="polite" aria-label="Opening camera">
      <p id="loading-spinner" aria-hidden="true">◌</p>
      <p>Opening Camera...</p>
    </section>

    <!-- Error states, displayed by future camera integration. -->
    <section id="error-message-section" hidden role="alert" aria-live="assertive" aria-label="Camera errors">
      <p id="camera-access-denied-message" hidden>Camera access denied.</p>
      <p id="camera-not-found-message" hidden>Camera not found.</p>
      <p id="camera-generic-error-message" hidden>Something went wrong.</p>
    </section>

    <footer id="footer-note">Frontend Clone using Browser Media APIs</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
